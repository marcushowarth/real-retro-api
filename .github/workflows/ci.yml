name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>marcushowarth</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build
        # -U forces a fresh check of the fin-model-rpi SNAPSHOT rather than
        # trusting a same-day cache — without it, this job can race
        # fin-model's own push-triggered `mvn deploy` (see its ci.yml) when
        # both repos are pushed close together, and fail on a real fix that
        # just hasn't finished publishing yet (hit 2026-09-14, kanban #981).
        # deploy.yml already does this for the same reason.
        run: mvn package -U
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
