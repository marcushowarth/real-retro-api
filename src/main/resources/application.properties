spring.application.name=real-income-api
server.port=8081

# H2 embedded — no external DB needed
spring.datasource.url=jdbc:h2:file:./data/real-income;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console (dev only — disable in prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS: override in prod e.g. https://income.howarth.eu
app.cors.allowed-origins=http://localhost:5173
